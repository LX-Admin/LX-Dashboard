<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Training Performance Dashboard</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Premium Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <!-- React & Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Babel Configuration -->
  <script>
    // Explicitly force Babel to use the "classic" React runtime.
    Babel.registerPreset('react-standalone', {
      presets: [
        [Babel.availablePresets['react'], { runtime: 'classic' }]
      ]
    });
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #021E16;
    }
    ::-webkit-scrollbar-thumb {
      background: #8F6B3E;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #C8A46B;
    }
    .glass-panel {
      background: rgba(10, 43, 34, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(143, 107, 62, 0.25);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }
    .gold-border-glow:hover {
      border-color: rgba(200, 164, 107, 0.8);
      box-shadow: 0 0 15px rgba(200, 164, 107, 0.15);
    }
    .glow-dot {
      box-shadow: 0 0 10px #C8A46B;
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .pulse-light {
      animation: pulse-slow 3s infinite;
    }
  </style>
</head>
<body class="bg-[#021E16] text-[#F5F3EE] overflow-x-hidden selection:bg-[#C8A46B] selection:text-[#021E16]">
  
  <div id="root"></div>

  <script type="text/babel" data-presets="react-standalone">
    const { useState, useEffect } = React;

    const RAW_DATA_URL = 'https://docs.google.com/spreadsheets/d/17pl95MG7qbn4NGn_YookTwkAYTopBUIvZj7jyq_Kcq0/edit?usp=drive_link';

    // Added EA Journey at the very top as requested!
    const LOOKER_STUDIO_URLS = {
      'EA Journey': '', 
      'LX Performance': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/THoyF?pageNavigation=hidden', 
      'Pre-Training': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/p_fzru8en83d?pageNavigation=hidden',
      'Training': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/p_tu8qg2e43d?pageNavigation=hidden',
      'Pre-Matching': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/p_zu5a8w613d?pageNavigation=hidden',
      'Post-Match': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/p_phk7g5d33d?pageNavigation=hidden',
      'Churn Data': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/p_xevgdwhf4d?pageNavigation=hidden'
    };

    const TAB_OPTIONS = Object.keys(LOOKER_STUDIO_URLS);

    function App() {
      // STATE MANAGEMENT
      const [selectedTab, setSelectedTab] = useState('LX Performance'); // Boot up with LX Performance so it's not empty on load
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [systemAlert, setSystemAlert] = useState(null);
      
      // Split View State
      const [isSplitView, setIsSplitView] = useState(false);
      const [comparisonTab, setComparisonTab] = useState(TAB_OPTIONS[1] || TAB_OPTIONS[0]);

      // Automatically collapse sidebar on smaller screens
      useEffect(() => {
        const handleResize = () => {
          if (window.innerWidth < 1366) {
            setSidebarCollapsed(true);
          }
        };
        handleResize();
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const triggerAlert = (message) => {
        setSystemAlert(message);
        setTimeout(() => setSystemAlert(null), 4000);
      };

      const handleTabSelect = (tabId) => {
        setSelectedTab(tabId);
        if (!isSplitView) {
          triggerAlert(`Switched to active view: "${tabId}"`);
        }
      };

      const toggleSplitView = () => {
        setIsSplitView(!isSplitView);
        if (!isSplitView) {
          triggerAlert("Split Comparison View Enabled");
        } else {
          triggerAlert("Returned to Single View");
        }
      };

      const activeEmbedUrlPrimary = LOOKER_STUDIO_URLS[selectedTab];
      const activeEmbedUrlSecondary = LOOKER_STUDIO_URLS[comparisonTab];

      return (
        <div className="h-screen w-screen bg-[#021E16] text-[#F5F3EE] font-sans antialiased flex flex-col md:flex-row overflow-hidden select-none">
          
          {/* COLLAPSIBLE LEFT SIDEBAR NAVIGATION (Hidden in Split View) */}
          {!isSplitView && (
            <aside className={`shrink-0 bg-[#0A2B22]/90 border-r border-[#8F6B3E]/30 flex flex-col z-20 transition-all duration-300 ${
              sidebarCollapsed ? 'w-full md:w-20' : 'w-full md:w-56'
            }`}>
              <div className={`p-4 md:p-5 border-b border-[#8F6B3E]/30 flex transition-all duration-300 ${
                sidebarCollapsed ? 'flex-col items-center gap-4' : 'items-center justify-between'
              }`}>
                <div className="flex items-center gap-3 overflow-hidden">
                  
                  <div className="w-9 h-9 relative shrink-0 flex items-center justify-center bg-[#063328] rounded-full border border-[#C8A46B]/40 shadow-[0_0_10px_rgba(200,164,107,0.2)]">
                    <svg className="w-5 h-5 text-[#C8A46B]" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.5">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0 0 12 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18M12 6.75h.008v.008H12V6.75Z" />
                    </svg>
                  </div>
                  
                  <div className={`transition-all duration-300 ${sidebarCollapsed ? 'opacity-0 max-w-0 pointer-events-none' : 'opacity-100 max-w-full'}`}>
                    <h1 className="text-lg font-bold tracking-widest text-[#F5F3EE] uppercase font-serif whitespace-nowrap">CODEX</h1>
                    <p className="text-[10px] text-[#A7B5AC] tracking-wider uppercase whitespace-nowrap">LX Dashboard</p>
                  </div>
                </div>

                <button 
                  onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                  className={`hidden md:flex p-1.5 rounded border border-[#8F6B3E]/40 hover:border-[#C8A46B] text-[#C8A46B] bg-[#021E16]/60 transition-colors cursor-pointer shrink-0 ${
                    sidebarCollapsed ? 'mt-1' : ''
                  }`}
                  title={sidebarCollapsed ? "Expand Sidebar" : "Collapse Sidebar"}
                >
                  <svg className={`w-4 h-4 transform transition-transform duration-300 ${sidebarCollapsed ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
                  </svg>
                </button>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex-1 p-3 space-y-1.5 overflow-y-auto">
                {!sidebarCollapsed && (
                  <p className="px-3 py-2 text-[11px] font-bold text-[#8F6B3E] tracking-widest uppercase transition-opacity duration-300">
                    Analytics Hub
                  </p>
                )}
                
                {[
                  { id: 'EA Journey', icon: 'M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5' },
                  { id: 'LX Performance', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
                  { id: 'Pre-Training', icon: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01' },
                  { id: 'Training', icon: 'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.168.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253' },
                  { id: 'Pre-Matching', icon: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' },
                  { id: 'Post-Match', icon: 'M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1' },
                  { id: 'Churn Data', icon: 'M13 17h8m0 0V9m0 8l-8-8-4 4-6-6' }
                ].map((item) => {
                  const isActive = selectedTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => handleTabSelect(item.id)}
                      className={`w-full flex items-center rounded transition-all duration-200 cursor-pointer ${
                        sidebarCollapsed ? 'justify-center py-3' : 'justify-between px-3 py-2'
                      } ${
                        isActive 
                          ? 'bg-[#063328] text-[#C8A46B] border-l-2 border-[#C8A46B] font-medium' 
                          : 'text-[#A7B5AC] hover:text-[#F5F3EE] hover:bg-[#063328]/50'
                      }`}
                      title={sidebarCollapsed ? item.id : ""}
                    >
                      <div className="flex items-center gap-3">
                        <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                          <path strokeLinecap="round" strokeLinejoin="round" d={item.icon} />
                        </svg>
                        {!sidebarCollapsed && (
                          <span className="text-sm whitespace-nowrap transition-all duration-300">{item.id}</span>
                        )}
                      </div>
                      {!sidebarCollapsed && isActive && (
                        <span className="w-1.5 h-1.5 rounded-full bg-[#C8A46B] glow-dot"></span>
                      )}
                    </button>
                  );
                })}
              </nav>

              {/* PERSISTENT FOOTER FOR RAW DATA */}
              <div className="p-3 border-t border-[#8F6B3E]/20 shrink-0">
                <a 
                  href={RAW_DATA_URL}
                  target="_blank"
                  rel="noopener noreferrer"
                  className={`w-full flex items-center rounded transition-all duration-200 hover:bg-[#063328]/50 hover:text-[#C8A46B] group border border-[#8F6B3E]/10 bg-[#021E16]/40 ${
                    sidebarCollapsed ? 'justify-center py-3' : 'justify-between px-3 py-2.5'
                  }`}
                  title="Tinker on Raw Spreadsheet"
                >
                  <div className="flex items-center gap-3">
                    <svg className="w-5 h-5 shrink-0 text-[#8F6B3E] group-hover:text-[#C8A46B] transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M3.75 3v11.25A2.25 2.25 0 006 16.5h12a2.25 2.25 0 002.25-2.25V3m-16.5 0h16.5m-16.5 0a2.25 2.25 0 012.25-2.25h12A2.25 2.25 0 0118 3m-12 4.5h12m-12 4.5h12M9 16.5v3.75M15 16.5v3.75M3 12h18" />
                    </svg>
                    {!sidebarCollapsed && (
                      <div className="text-left leading-tight">
                        <p className="text-xs font-semibold text-[#F5F3EE] group-hover:text-[#C8A46B] transition-colors">Raw Data Feed</p>
                        <p className="text-[9px] text-[#A7B5AC]">Tinker on Sheet</p>
                      </div>
                    )}
                  </div>
                  {!sidebarCollapsed && (
                    <svg className="w-3.5 h-3.5 text-[#8F6B3E] group-hover:text-[#C8A46B] transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                  )}
                </a>
              </div>
            </aside>
          )}

          <main className="flex-1 flex flex-col min-w-0 bg-[#021E16] h-screen overflow-hidden">
            
            <div className="flex-1 w-full flex flex-col h-full overflow-hidden border-x border-[#8F6B3E]/10">
              
              {/* COMPACT TOP NAVIGATION BAR */}
              <header className="bg-[#0A2B22]/95 border-b border-[#8F6B3E]/20 py-2.5 px-4 shrink-0 flex items-center justify-between z-10">
                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-3">
                    <span className="text-[10px] px-2 py-0.5 bg-[#8F6B3E]/20 text-[#C8A46B] border border-[#8F6B3E]/40 rounded font-mono uppercase tracking-widest">
                      CODEX 2.0 Portal
                    </span>
                    
                    <div className="flex items-center gap-1.5">
                      <span className="w-2.5 h-2.5 rounded-full bg-red-500 shadow-[0_0_10px_#ef4444] animate-pulse"></span>
                      <span className="text-xs text-[#A7B5AC] font-mono tracking-wide">Under Maintenance</span>
                    </div>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <button 
                    onClick={toggleSplitView}
                    className={`flex items-center gap-2 px-3 py-1.5 rounded text-xs font-medium border transition-colors ${
                      isSplitView 
                        ? 'bg-[#063328] border-[#C8A46B] text-[#C8A46B] shadow-[0_0_10px_rgba(200,164,107,0.2)]' 
                        : 'bg-[#021E16]/60 border-[#8F6B3E]/40 text-[#A7B5AC] hover:border-[#C8A46B] hover:text-[#F5F3EE]'
                    }`}
                    title="Compare side-by-side"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.5">
                      <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                      <line x1="12" y1="3" x2="12" y2="21" />
                    </svg>
                    Split View
                  </button>
                </div>
              </header>

              {systemAlert && (
                <div className="absolute top-16 right-6 bg-[#0A2B22] border-l-4 border-[#C8A46B] p-2.5 text-xs text-[#F5F3EE] rounded shadow-2xl z-50 animate-bounce alert-toast">
                  {systemAlert}
                </div>
              )}

              <div className="flex-1 w-full bg-[#021E16] overflow-hidden min-h-0 relative flex flex-row">
                
                {/* PRIMARY PANEL */}
                <div className={`relative flex flex-col h-full overflow-hidden transition-all duration-300 ${isSplitView ? 'w-1/2 shrink-0 border-r border-[#8F6B3E]/30' : 'w-full'}`}>
                  
                  {isSplitView && (
                    <div className="w-full shrink-0 bg-[#0A2B22]/90 border-b border-[#8F6B3E]/20 p-2 z-10 flex justify-between items-center px-4 backdrop-blur-sm shadow-md">
                      <span className="text-[10px] font-bold text-[#8F6B3E] tracking-widest uppercase">Primary View</span>
                      <select 
                        value={selectedTab} 
                        onChange={(e) => handleTabSelect(e.target.value)}
                        className="bg-[#021E16] text-[#C8A46B] border border-[#8F6B3E]/50 rounded text-xs font-serif uppercase px-2 py-1 outline-none focus:border-[#C8A46B] cursor-pointer"
                      >
                        {TAB_OPTIONS.map(tab => (
                          <option key={tab} value={tab}>{tab}</option>
                        ))}
                      </select>
                    </div>
                  )}

                  <div className="flex-1 w-full relative">
                    {activeEmbedUrlPrimary ? (
                      <div className="absolute inset-0 w-full h-full overflow-hidden">
                        <iframe 
                          src={activeEmbedUrlPrimary} 
                          className="absolute left-0 top-0 w-full"
                          style={{ height: 'calc(100% + 36px)', border: 'none', colorScheme: 'dark' }}
                          allowFullScreen
                          sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
                        ></iframe>
                      </div>
                    ) : (
                      <div className="w-full h-full flex flex-col items-center justify-center p-6 text-center bg-[#01140E]">
                        <svg className="w-12 h-12 text-[#8F6B3E]/50 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        <p className="text-xs font-serif tracking-widest text-[#C8A46B] uppercase mb-1">Module Pending</p>
                        <p className="text-[10px] text-[#A7B5AC] max-w-xs mt-1">
                          {selectedTab === 'EA Journey' 
                            ? "This dataset has requested PTO. It will return to work once its Looker Studio link is configured." 
                            : `Data Studio link for ${selectedTab} is being configured...`}
                        </p>
                      </div>
                    )}
                  </div>
                </div>

                {/* SECONDARY PANEL (Only rendered if Split View is active) */}
                {isSplitView && (
                  <div className="relative flex flex-col h-full w-1/2 shrink-0 overflow-hidden bg-[#01140E]">
                    
                    <div className="w-full shrink-0 bg-[#0A2B22]/90 border-b border-[#8F6B3E]/20 p-2 z-10 flex justify-between items-center px-4 backdrop-blur-sm shadow-md">
                      <span className="text-[10px] font-bold text-[#8F6B3E] tracking-widest uppercase">Comparison View</span>
                      <select 
                        value={comparisonTab} 
                        onChange={(e) => setComparisonTab(e.target.value)}
                        className="bg-[#021E16] text-[#C8A46B] border border-[#8F6B3E]/50 rounded text-xs font-serif uppercase px-2 py-1 outline-none focus:border-[#C8A46B] cursor-pointer"
                      >
                        {TAB_OPTIONS.map(tab => (
                          <option key={tab} value={tab}>{tab}</option>
                        ))}
                      </select>
                    </div>

                    <div className="flex-1 w-full relative">
                      {activeEmbedUrlSecondary ? (
                        <div className="absolute inset-0 w-full h-full overflow-hidden">
                          <iframe 
                            src={activeEmbedUrlSecondary} 
                            className="absolute left-0 top-0 w-full"
                            style={{ height: 'calc(100% + 36px)', border: 'none', colorScheme: 'dark' }}
                            allowFullScreen
                            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
                          ></iframe>
                        </div>
                      ) : (
                        <div className="w-full h-full flex flex-col items-center justify-center p-6 text-center bg-[#01140E]">
                          <svg className="w-12 h-12 text-[#8F6B3E]/50 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                          </svg>
                          <p className="text-xs font-serif tracking-widest text-[#C8A46B] uppercase mb-1">Module Pending</p>
                          <p className="text-[10px] text-[#A7B5AC] max-w-xs mt-1">
                            {comparisonTab === 'EA Journey' 
                              ? "This dataset has requested PTO. It will return to work once its Looker Studio link is configured." 
                              : `Data Studio link for ${comparisonTab} is being configured...`}
                          </p>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
